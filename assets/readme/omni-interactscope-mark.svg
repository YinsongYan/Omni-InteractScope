<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Omni-InteractScope</title>
  <desc id="desc">A focus ring surrounding a colorful audio waveform</desc>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38D9C8"/>
      <stop offset=".5" stop-color="#5FA8F5"/>
      <stop offset="1" stop-color="#AF7CF4"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#46E0D2"/>
      <stop offset="1" stop-color="#C19AFF"/>
    </linearGradient>
    <radialGradient id="face" cx=".35" cy=".25" r=".9">
      <stop offset="0" stop-color="#223858"/>
      <stop offset="1" stop-color="#10162B"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="99" fill="none" stroke="url(#ring)" stroke-opacity=".28" stroke-width="2"/>
  <circle cx="120" cy="120" r="87" fill="url(#face)" stroke="url(#ring)" stroke-width="9"/>
  <circle cx="120" cy="120" r="70" fill="none" stroke="#D8E8FF" stroke-opacity=".12" stroke-width="1.5"/>
  <path d="M36 55A107 107 0 0 1 82 18" fill="none" stroke="#45DCCE" stroke-width="6" stroke-linecap="round"/>
  <path d="M204 185A107 107 0 0 1 158 222" fill="none" stroke="#AC83F1" stroke-width="6" stroke-linecap="round"/>
  <circle cx="82" cy="18" r="5" fill="#45DCCE"/>
  <circle cx="158" cy="222" r="5" fill="#AC83F1"/>
  <g fill="url(#bars)">
    <rect x="69" y="107" width="11" height="26" rx="5.5"/>
    <rect x="87" y="92" width="11" height="56" rx="5.5"/>
    <rect x="105" y="75" width="11" height="90" rx="5.5"/>
    <rect x="123" y="93" width="11" height="54" rx="5.5"/>
    <rect x="141" y="84" width="11" height="72" rx="5.5"/>
    <rect x="159" y="106" width="11" height="28" rx="5.5"/>
  </g>
</svg>
