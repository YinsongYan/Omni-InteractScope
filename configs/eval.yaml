paths: {}
filters:
  exclude_task_types: []
  include_task_types: []
  include_silence_negatives: false
  drop_invalid_duration: true
  drop_unknown_task_type: true
  require_available: false
  require_publishable: false
temporal:
  tolerance_sec: 2.0
  merge_gap_sec: 2.0
offline_probing:
  grid_span_sec: 4.0
  probe_interval_sec: 1.0
  max_frames: 32
  sample_fps: 1.0
online_rolling:
  fps: 1.0
  max_frames: 0
modality:
  asr_backend: cache
  asr_model: Qwen/Qwen3-ASR-1.7B-hf
  asr_timestamps: aligner
  asr_aligner_model: Qwen/Qwen3-ForcedAligner-0.6B-hf
  asr_window_sec: 20.0
  asr_segment_max_sec: 8.0
  asr_force_language: false
  asr_context_chars: 0
  asr_device: cuda
judge:
  provider: openai
  model: gpt-4o-2024-08-06
  mode: binary
  temperature: 0.0
  mock: false
  workers: 8
content:
  tool_f1_pass: 1.0
turn_taking:
  noise_window_sec: 4.0
t8:
  full_horizon: true
  query_audio_policy: native_or_annotated_text
